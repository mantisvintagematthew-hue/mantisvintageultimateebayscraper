[project]
name = "vintage-tag-catalog"
version = "0.1.0"
description = "Local-first eBay vintage tee dating pipeline"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.3",
  "sqlalchemy>=2.0.32",
  "pillow>=10.4.0",
  "opencv-python>=4.10.0.84",
  "python-dotenv>=1.0.1",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.4",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.7"]
ocr = ["easyocr>=1.7.1"]

[project.scripts]
vtc = "app.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.ui" = ["templates/*.html"]
